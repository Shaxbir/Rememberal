<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>QuickList</title>
  <link rel="stylesheet" href="styles.css">
  <script type="module" src="js/app.js"></script>
</head>
<body>
  <header>
    <h1>Priority Shopping List</h1>
  </header>

  <main>
    <p id="error-message" class="error hidden" role="alert"></p>

    <section id="lists-panel">
      <h2>My Lists</h2>
      <ul id="list-tabs"></ul>
      <form id="new-list-form">
        <label for="new-list-name">New list name</label>
        <input id="new-list-name" type="text" maxlength="50" autocomplete="off">
        <button type="submit">Create list</button>
      </form>
    </section>

    <p id="empty-state" class="hidden">No list selected. Create a list to get started.</p>

    <section id="active-list" class="hidden">
      <div id="active-list-header">
        <h2 id="active-list-title"></h2>
        <button id="rename-list-button" type="button">Rename</button>
        <button id="delete-list-button" type="button">Delete</button>
      </div>

      <form id="add-item-form">
        <label for="item-name">Item</label>
        <input id="item-name" type="text" maxlength="50" autocomplete="off">
        <label for="item-quantity">Quantity</label>
        <input id="item-quantity" type="number" min="1" max="99" step="1" value="1">
        <label for="item-category">Category</label>
        <select id="item-category"></select>
        <button type="submit">Add item</button>
      </form>
      <ol id="item-list"></ol>
      <div id="list-footer">
        <span id="progress"></span>
        <button id="clear-purchased-button" type="button">Clear purchased</button>
      </div>
    </section>
  </main>
</body>
</html>
